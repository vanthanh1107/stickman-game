<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đấu Trường Stickman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #1e272e; margin: 0; padding: 0;">

<div id="game-container">
    <div id="selection-screen">
        <h2 style="text-align: center; color: #fff; text-shadow: 0 0 10px #f1c40f;">ĐẤU TRƯỜNG STICKMAN</h2>
        <div id="auth-section" style="text-align: center; margin-bottom: 20px;"></div>
        <div id="character-carousel" class="carousel-container"></div>
        <div id="desc-red" class="stats-display"></div>
        
        <div style="text-align: center; margin-top: 20px;">
            <label style="color:#fff; font-weight:bold;">Chế độ: </label>
            <select id="enemy-count-select">
                <option value="1">1 vs 1 (Khởi động)</option>
                <option value="3">1 vs 3 (Khó)</option>
                <option value="10">1 vs 10 (Sinh tồn)</option>
                <option value="99">BOSS: RỒNG KHỔNG LỒ 🐉</option>
            </select>
        </div>
        <div style="text-align: center; margin-top: 25px;">
            <button class="game-btn" onclick="startGame()">BẮT ĐẦU CHIẾN ĐẤU</button>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="hud-container">
            <div class="player-hud" id="hp-wrapper-1">
                <div id="name-display-red">👤</div>
                <div class="bar-bg"><div id="hp-red-trail" class="bar-trail"></div><div id="hp-red" class="bar-fill hp-fill"></div></div>
                <div class="bar-bg mini-bar"><div id="stamina-red" class="bar-fill stamina-fill"></div></div>
                <div class="bar-bg mini-bar"><div id="stun-red" class="bar-fill stun-fill" style="background:#00d2d3;"></div></div>
            </div>
            <div class="player-hud right-hud" id="hp-wrapper-2">
                <div id="name-display-blue">🤖</div>
                <div class="bar-bg"><div id="hp-blue-trail" class="bar-trail"></div><div id="hp-blue" class="bar-fill hp-fill"></div></div>
                <div class="bar-bg mini-bar"><div id="stamina-blue" class="bar-fill stamina-fill"></div></div>
                <div class="bar-bg mini-bar"><div id="stun-blue" class="bar-fill stun-fill" style="background:#00d2d3;"></div></div>
            </div>
        </div>

        <div style="text-align: center;">
            <canvas id="battleCanvas" width="800" height="400"></canvas>
        </div>

        <div class="control-btns">
            <button class="game-btn" onclick="backToMenu()" style="background:#2f3640;">🔙 THOÁT</button>
            <button id="btn-audio" class="game-btn" onclick="toggleAudio(event)" style="background:#2f3640;">🔇</button>
            <button id="btn-s1" class="skill-btn" onclick="playerUseSkill(1)">Dempsey Roll</button>
            <button id="btn-s2" class="skill-btn" onclick="playerUseSkill(2)">Axe Kick</button>
            <button id="btn-s3" class="skill-btn" onclick="playerUseSkill(3)">1-Inch Punch</button>
            <button id="btn-dodge" class="skill-btn" onclick="playerDodge()">Lùi Né</button>
        </div>
    </div>
</div>

<script src="game-auth.js"></script>
<script src="engine.js"></script>
<script src="fighter.js"></script>
<script src="combat.js"></script>
<script src="main.js"></script>

</body>
</html>
