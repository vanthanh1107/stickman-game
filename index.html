<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Stickman</title>
    
    <!-- Thêm thư viện này ĐỂ MỞ KHÓA SHAREDARRAYBUFFER TRÊN GITHUB PAGES -->
    <script src="https://cdn.jsdelivr.net/npm/coi-serviceworker@0.1.6/coi-serviceworker.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="selection-screen">
        <div class="cyber-header">
            <h1 class="glitch-title">ĐẤU TRƯỜNG STICKMAN</h1>
            <div id="auth-section"></div>
        </div>
        
        <div class="main-selection-layout">
            
            <div class="left-side-column">
                <div class="preview-box-small">
                    <div class="pedestal-glow"></div>
                    <canvas id="preview-canvas" width="240" height="300"></canvas>
                </div>
                
                <div class="stats-box-integrated">
                    <div class="stats-header">THÔNG SỐ CHIẾN BINH</div>
                    <div id="desc-red" class="modern-stats">
                        <span style="color:#a4b0be; font-style:italic; text-align: center;">⏳ Đang tải dữ liệu...</span>
                    </div>
                </div>
            </div>

            <div class="right-side-column">
                <div class="roster-header">DANH SÁCH CHIẾN BINH</div>
                <div id="character-carousel" class="roster-grid"></div>
            </div>
            
        </div>

        <div class="row-bottom-controls">
            <div class="mode-select-wrapper">
                <label>CHẾ ĐỘ CHƠI</label>
                <select id="enemy-count-select">
                    <option value="1">1 vs 1 (Khởi động)</option>
                    <option value="3">1 vs 3 (Khó)</option>
                    <option value="10">1 vs 10 (Sinh tồn)</option>
                    <option value="99">BOSS: RỒNG KHỔNG LỒ 🐉</option>
                </select>
            </div>
            <button class="btn-ultimate-start" onclick="startGame()">BẮT ĐẦU CHIẾN ĐẤU</button>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="hud-container">
            <div class="player-hud" id="hp-wrapper-1">
                <div id="name-display-red" class="fighter-name">👤</div>
                <div class="bar-bg"><div id="hp-red-trail" class="bar-trail"></div><div id="hp-red" class="bar-fill hp-fill"></div></div>
                <div class="bar-bg mini-bar"><div id="stamina-red" class="bar-fill stamina-fill"></div></div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="player-hud right-hud" id="hp-wrapper-2">
                <div id="name-display-blue" class="fighter-name">🤖</div>
                <div class="bar-bg"><div id="hp-blue-trail" class="bar-trail"></div><div id="hp-blue" class="bar-fill hp-fill"></div></div>
                <div class="bar-bg mini-bar"><div id="stamina-blue" class="bar-fill stamina-fill"></div></div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="battleCanvas" width="800" height="400"></canvas>
        </div>

        <div class="control-btns">
            <button class="game-btn btn-exit" onclick="backToMenu()">🔙 THOÁT</button>
            <button id="btn-audio" class="game-btn btn-mute" onclick="toggleAudio(event)">🔇</button>
            <button id="btn-block" class="skill-btn block-btn" onclick="playerBlock()">🛡️ ĐỠ ĐÒN</button>
            <button id="btn-dodge" class="skill-btn dodge-btn" onclick="playerDodge()">💨 LÙI NÉ</button>
        </div>
    </div>
</div>

<script>
//<![CDATA[
(function() {
    // Trở lại dùng Githack nhưng với phiên bản an toàn chống lỗi 425
    var repoUrl = "https://raw.githack.com/vanthanh1107/stickman-game/main/";
    
    // Thuật toán bẻ cache: Làm mới mỗi 1 phút (60,000 mili-giây)
    var ts = Math.floor(new Date().getTime() / 60000); 
    
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = repoUrl + "style_v2.css?v=" + ts;
    document.head.appendChild(css);
    
    var files = [
        'game-auth.js', 
        'config_v3.js', 
        'graphics_v5.js', 
        'char_billgates.js',
        'char_elonmusk.js',
        'char_ronaldo.js',
        'char_messi.js',
        'char_neymar.js',
        'char_mbappe.js',
        'char_mtp.js',
        'char_vozinha.js',
        'char_haaland.js',
        'char_therock.js',
        'char_lamineyamal.js',
        'char_spiderman.js',
        'engine_v70.js', 
        'recorder_v113.js', 
        'main_v4.js',
        'enviroment_v7.js'
    ];
    var loaded = 0;

    files.forEach(function(file) {
        var script = document.createElement('script');
        script.src = repoUrl + file + "?v=" + ts;
        script.async = false; 
        
        script.onload = script.onerror = function() {
            loaded++;
            if (loaded === files.length) {
                if(typeof window.initGame === 'function') window.initGame();
            }
        };
        document.body.appendChild(script);
    });
})();
//]]>
</script>

</body>
</html>
