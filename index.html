<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đấu Trường Stickman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="selection-screen">
            <h2 style="text-align: center; color: #fff;">ĐẤU TRƯỜNG STICKMAN</h2>
            <div id="auth-section"></div>
            <div id="character-carousel" class="carousel-container"></div>
            <div id="desc-red" class="stats-display"></div>
            <button class="game-btn" onclick="window.startGame()">BẮT ĐẦU</button>
        </div>
        <div id="game-screen" style="display: none;">
            <canvas id="battleCanvas" width="800" height="400"></canvas>
        </div>
    </div>
    <script src="game-auth.js"></script>
    <script src="engine.js"></script>
    <script src="fighter.js"></script>
    <script src="combat.js"></script>
    <script src="main.js"></script>
    <script>
        // Kiểm tra xem game đã load chưa
        window.onload = () => {
            if(typeof window.initGame === 'function') {
                window.initGame();
            } else {
                console.log("File main.js chưa tải xong hoặc có lỗi!");
            }
        };
    </script>
</body>
</html>
